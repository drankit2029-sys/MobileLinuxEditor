# MobileLinuxEditor - iOS CI build (React Native 0.74.5 + headless UTM-QEMU)
#
# v10: fix the v9 regression - UIApplication in qemuDidExitWithStatus ran on the
#      VM thread (Main Thread Checker abort, .ips lost inside exit()) -> all UIKit
#      now hops to main. -qmp rewritten as proven -chardev socket + -mon so a
#      parser quirk can't kill init. bridgeLog tees to the on-disk log too.
# v9: silence-busting - keep the app awake while QEMU runs (iOS suspends all
#     threads on auto-lock: 30 min of watch time can be seconds of emulation),
#     earlycon on the kernel cmdline (prints from the very first boot stage,
#     before the full UART driver exists), -no-reboot, argv echo into the
#     terminal, and timed QMP 'query-status' probes (t+90s/7min/20min) that
#     prove whether QEMU's main loop is alive even if the guest is silent.
# v8: native patient serial auto-connect (JS only waited 6 s), -nographic replaced
#     by -monitor none (nographic muxes the monitor onto stdio), QMP-backed stopVM
#     (Stop really stops QEMU), [bridge] status lines printed into the terminal,
#     EINTR-safe serial/stderr reader loops.
# v7: fix "failed to find romfile efi-virtio.rom" - disable the virtio-net option
#     ROM (romfile=). Those ROMs live in QEMU's pc-bios data dir (not shipped in
#     the bundle) and are useless on ARM virt anyway: the guest uses native
#     virtio drivers, no BIOS boot. Observed via the v6 stderr tap.
# v6: crash forensics + hardening - QEMU stderr piped live to the terminal AND
#     to Documents/qemu-stderr.log (Files app can read it after a crash);
#     guest pre-flight (sizes), no in-process restart, serial only when running,
#     8MB VM thread stack, explicit -display none, UIFileSharingEnabled.
# v5: real Alpine guest (netboot vmlinuz-virt + initramfs-virt, ~20MB);
#     serial bridge (connectSerial/writeSerial/disconnectSerial +
#     SerialData/VMStatus events), QEMU exit() guard, VM restart support.
# v4: TARGETED_DEVICE_FAMILY replace-or-INSERT (template omits the key);
#     minimal prune (ONLY EGL/GLESv2 are restricted; spice/virgl/epoxy are
#     LC_LOADed by QEMU itself and must stay for runtime dlopen);
#     @rpath-embed gate + transitive EGL/GLES audit; SIGPIPE-free symbol gate.
# v3: universal iPhone/iPad layout + launch-crash hardening
#  - TARGETED_DEVICE_FAMILY = "1,2" (was iPhone-only -> tiny window on iPad)
#  - Info.plist: UIRequiresFullScreen=true + all 4 iPad orientations
#  - react-native-webview pinned to exact 13.10.5 (era-correct for RN 0.74;
#    ^13.10.5 was resolving to 13.17, untested with RN 0.74, prime suspect
#    for the instant-close-on-launch)
#  - App.tsx import auto-fix: '@dr.pogodin/react-native-fs' -> 'react-native-fs'
#    (removes dependence on the node_modules shim at Metro bundle time)
#  - dSYM uploaded as artifact so any native crash can be symbolicated
#
# v2 root-cause fix (kept): QEMU is loaded via dlopen+dlsym trio
# (qemu_init/qemu_main_loop/qemu_cleanup) exactly like UTM itself -
# UTM's frameworks do NOT export qemu_main, which caused the link crash.
name: Build iOS Native Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (matches RN 0.74)
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            echo "NOTE: Xcode_15.4.app not on runner, using default Xcode"
            ls /Applications/ | grep -i xcode || true
          fi
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install NPM Dependencies
        run: |
          node << 'NODEEOF'
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = pkg.dependencies || {};
            pkg.devDependencies = pkg.devDependencies || {};
            delete pkg.dependencies["@dr.pogodin/react-native-fs"];
            pkg.dependencies["react"] = "18.2.0";
            pkg.dependencies["react-native"] = "0.74.5";
            pkg.dependencies["react-native-fs"] = "2.20.0";
            pkg.dependencies["react-native-webview"] = "13.10.5";
            pkg.devDependencies["@react-native/babel-preset"] = "0.74.89";
            pkg.devDependencies["@react-native/metro-config"] = "0.74.89";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("package.json normalized for RN 0.74.5");
          NODEEOF
          npm install --legacy-peer-deps
          node << 'NODEEOF'
            const fs = require("fs");
            const dir = "./node_modules/@dr.pogodin/react-native-fs";
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(dir + "/package.json", JSON.stringify({ name: "@dr.pogodin/react-native-fs", version: "0.0.0-shim", main: "index.js" }, null, 2));
            fs.writeFileSync(dir + "/index.js", "module.exports = require(\"react-native-fs\");\n");
            console.log("backward-compat shim installed");
          NODEEOF

      - name: Configure Babel, Metro, and App Starter
        run: |
          node << 'NODEEOF'
            const fs = require("fs");
            fs.writeFileSync("babel.config.js", "module.exports = { presets: [\"module:@react-native/babel-preset\"] };\n");
            fs.writeFileSync("metro.config.js", "const { getDefaultConfig, mergeConfig } = require(\"@react-native/metro-config\");\nmodule.exports = mergeConfig(getDefaultConfig(__dirname), {});\n");
            console.log("babel.config.js + metro.config.js written");
            if (!fs.existsSync("App.tsx") || fs.readFileSync("App.tsx", "utf8").trim().length === 0) {
              fs.writeFileSync("App.tsx", [
                "import React from 'react';",
                "import { SafeAreaView, Text, StyleSheet } from 'react-native';",
                "",
                "export default function App() {",
                "  return (",
                "    <SafeAreaView style={styles.container}>",
                "      <Text style={styles.text}>Mobile Linux Editor</Text>",
                "    </SafeAreaView>",
                "  );",
                "}",
                "",
                "const styles = StyleSheet.create({",
                "  container: { flex: 1, backgroundColor: '#1e1e1e', justifyContent: 'center', alignItems: 'center' },",
                "  text: { color: '#ffffff', fontSize: 20 },",
                "});",
                ""
              ].join("\n"));
              console.log("App.tsx starter written");
            } else {
              console.log("App.tsx already exists, kept as-is");
            }
            if (fs.existsSync("App.tsx")) {
              let app = fs.readFileSync("App.tsx", "utf8");
              if (app.includes("@dr.pogodin/react-native-fs")) {
                app = app.split("from '@dr.pogodin/react-native-fs'").join("from 'react-native-fs'");
                app = app.split('from "@dr.pogodin/react-native-fs"').join('from "react-native-fs"');
                fs.writeFileSync("App.tsx", app);
                console.log("App.tsx: @dr.pogodin import rewritten to react-native-fs");
              }
            }
          NODEEOF

      - name: Scaffold React Native iOS Project
        run: |
          npx @react-native-community/cli@13.6.9 init MobileLinuxEditor --version 0.74.5 --directory ./NativeTemp --skip-install
          mkdir -p ios
          cp -R NativeTemp/ios/. ./ios/
          cp -n NativeTemp/app.json ./ || true
          cp -n NativeTemp/index.js ./ || true
          rm -rf NativeTemp
          ls ios

      - name: Configure React Native Node Environment
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Assemble UTM-QEMU Local Pod (Headless Engine)
        run: |
          mkdir -p ios/UTM-QEMU/Frameworks
          mkdir -p ios/UTM-QEMU/Sources
          mkdir -p ios/UTM-QEMU/Resources

          # Real Alpine Linux guest (aarch64 virt netboot): kernel + initramfs.
          # URLs verified live (~20MB total). -fSL fails loudly, never ships empty.
          mkdir -p assets/guest
          curl -fSL -o assets/guest/vmlinuz-virt https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/netboot/vmlinuz-virt
          curl -fSL -o assets/guest/initramfs-virt https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/netboot/initramfs-virt
          ls -lh assets/guest/
          cp assets/guest/vmlinuz-virt ios/UTM-QEMU/Resources/
          cp assets/guest/initramfs-virt ios/UTM-QEMU/Resources/

          cat << 'EOF' > ios/UTM-QEMU/Sources/LinuxVMBridge.m
          #import <React/RCTBridgeModule.h>
          #import <React/RCTEventEmitter.h>
          #import <UIKit/UIKit.h>
          #import <dispatch/dispatch.h>
          #import <pthread.h>
          #import <dlfcn.h>
          #import <stdlib.h>
          #import <stdio.h>
          #import <string.h>
          #import <unistd.h>
          #import <sys/socket.h>
          #import <errno.h>
          #import <sys/un.h>
          #import <sys/time.h>
          #import <netinet/in.h>
          #import <arpa/inet.h>

          extern char **environ;

          @interface LinuxVMBridge : RCTEventEmitter <RCTBridgeModule>
          @end

          // UTM's QEMU frameworks expose NO link-time entry point. Like UTM itself
          // (UTMQemuSystem.m / QEMULauncher/Bootstrap.c), we dlopen() the framework
          // and resolve this trio at runtime:
          //   int  qemu_init(int argc, const char *argv[], const char *envp[])
          //   void qemu_main_loop(void)
          //   void qemu_cleanup(void)
          typedef int (*QEMUInitFunc)(int argc, const char *argv[], const char *envp[]);
          typedef void (*QEMUMainLoopFunc)(void);
          typedef void (*QEMUCleanupFunc)(void);

          typedef struct {
              QEMUInitFunc qemu_init;
              QEMUMainLoopFunc qemu_main_loop;
              QEMUCleanupFunc qemu_cleanup;
              int argc;
              char **argv;
              __unsafe_unretained LinuxVMBridge *module;
          } VMThreadArgs;

          typedef struct {
              __unsafe_unretained LinuxVMBridge *module;
              int fd;
          } SerialThreadArgs;

          typedef struct {
              __unsafe_unretained LinuxVMBridge *module;
              int fd;
              FILE *logFile;
          } StderrThreadArgs;

          static pthread_t g_qemu_thread;
          static BOOL g_qemu_thread_valid = NO;
          static __unsafe_unretained LinuxVMBridge *g_module = nil;
          static FILE *g_stderrLog = NULL;

          @interface LinuxVMBridge ()
          - (void)qemuDidExitWithStatus:(NSString *)status;
          - (void)emitSerialData:(NSData *)data;
          - (void)emitStderrData:(NSData *)data;
          - (void)serialDidDisconnect;
          - (void)bridgeLog:(NSString *)line;
          - (BOOL)vmRunning;
          - (BOOL)tryConnectSerialOnce;
          @end

          @implementation LinuxVMBridge {
              BOOL _isRunning;
              BOOL _vmEverRan;
              int _serialFd;
              BOOL _serialConnected;
          }

          RCT_EXPORT_MODULE();

          + (BOOL)requiresMainQueueSetup {
              return NO;
          }

          - (instancetype)init {
              self = [super init];
              if (self) {
                  _serialFd = -1;
              }
              return self;
          }

          - (NSArray<NSString *> *)supportedEvents {
              return @[@"SerialData", @"VMStatus"];
          }

          - (void)qemuDidExitWithStatus:(NSString *)status {
              _isRunning = NO;
              g_qemu_thread_valid = NO;
              // v10: this method runs on QEMU's VM thread and inside atexit
              // context. UIKit (idle timer) is main-thread-only; a direct call
              // trips the Main Thread Checker and aborts the app mid-exit.
              dispatch_async(dispatch_get_main_queue(), ^{
                  [UIApplication sharedApplication].idleTimerDisabled = NO;
                  [self bridgeLog:[NSString stringWithFormat:@"[bridge] QEMU exited (%@). To boot again: force-quit and reopen the app.", status]];
              });
              [self sendEventWithName:@"VMStatus" body:@{@"status": status}];
          }

          - (void)emitSerialData:(NSData *)data {
              if (!_serialConnected) {
                  return;
              }
              NSString *b64 = [data base64EncodedStringWithOptions:0];
              [self sendEventWithName:@"SerialData" body:@{@"data": b64}];
          }

          - (void)serialDidDisconnect {
              if (_serialFd >= 0) {
                  close(_serialFd);
                  _serialFd = -1;
              }
              _serialConnected = NO;
              [self sendEventWithName:@"VMStatus" body:@{@"status": @"serial-disconnected"}];
          }

          // QEMU's own stderr (errors, aborts, boot diagnostics). Deliberately NOT
          // gated on _serialConnected: most valuable exactly when serial never comes up.
          - (void)emitStderrData:(NSData *)data {
              NSString *b64 = [data base64EncodedStringWithOptions:0];
              [self sendEventWithName:@"SerialData" body:@{@"data": b64}];
          }

          static void *vm_thread_worker(void *arg) {
              VMThreadArgs *t = (VMThreadArgs *)arg;
              int ret = t->qemu_init(t->argc,
                                     (const char **)t->argv,
                                     (const char **)environ);
              if (ret == 0) {
                  t->qemu_main_loop();
                  t->qemu_cleanup();
              }
              for (int i = 0; i < t->argc; i++) {
                  free(t->argv[i]);
              }
              free(t->argv);
              LinuxVMBridge *module = t->module;
              free(t);
              // QEMU returned (guest shutdown or init failure): notify JS + allow restart.
              @autoreleasepool {
                  [module qemuDidExitWithStatus:(ret == 0 ? @"exited" : @"init-failed")];
              }
              return NULL;
          }

          static void *serial_read_worker(void *arg) {
              SerialThreadArgs *s = (SerialThreadArgs *)arg;
              int fd = s->fd;
              LinuxVMBridge *module = s->module;
              free(s);
              uint8_t buf[4096];
              ssize_t n;
              for (;;) {
                  n = recv(fd, buf, sizeof(buf), 0);
                  if (n > 0) {
                      @autoreleasepool {
                          NSData *data = [NSData dataWithBytes:buf length:(NSUInteger)n];
                          [module emitSerialData:data];
                      }
                      continue;
                  }
                  if (n < 0 && errno == EINTR) {
                      continue;
                  }
                  break;
              }
              @autoreleasepool {
                  [module serialDidDisconnect];
              }
              return NULL;
          }

          // v8: single owner of the serial TCP connect, shared by the JS
          // connectSerial call and the patient native retry loop below.
          - (BOOL)tryConnectSerialOnce {
              if (_serialConnected) {
                  return YES;
              }
              if (!_isRunning) {
                  return NO;
              }
              int fd = socket(AF_INET, SOCK_STREAM, 0);
              if (fd < 0) {
                  return NO;
              }
              struct sockaddr_in addr;
              memset(&addr, 0, sizeof(addr));
              addr.sin_family = AF_INET;
              addr.sin_port = htons(4000);
              addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
              if (connect(fd, (struct sockaddr *)&addr, sizeof(addr)) != 0) {
                  close(fd);
                  return NO;
              }
              _serialFd = fd;
              _serialConnected = YES;
              SerialThreadArgs *s = malloc(sizeof(SerialThreadArgs));
              s->module = self;
              s->fd = fd;
              pthread_t thread;
              if (pthread_create(&thread, NULL, serial_read_worker, s) != 0) {
                  free(s);
                  close(fd);
                  _serialFd = -1;
                  _serialConnected = NO;
                  return NO;
              }
              pthread_detach(thread);
              [self bridgeLog:@"[bridge] serial connected - waiting for guest output. Under CPU emulation the first kernel line can still take a few minutes."];
              [self sendEventWithName:@"VMStatus" body:@{@"status": @"serial-connected"}];
              return YES;
          }

          - (BOOL)vmRunning {
              return _isRunning;
          }

          // A human-readable line into the terminal tab. Rides the same base64
          // SerialData channel as stderr; the on-disk log carries QEMU's own
          // stderr only (the tee sits in front of QEMU's pipe, not this path).
          - (void)bridgeLog:(NSString *)line {
              // v10: tee to the on-disk log as well, so the whole [bridge] story
              // survives an app crash and can be read afterwards from
              // Files -> MobileLinuxEditor -> qemu-stderr.log.
              FILE *lf = g_stderrLog;
              if (lf) {
                  fprintf(lf, "%s\n", [line UTF8String]);
                  fflush(lf);
              }
              NSString *text = [line stringByAppendingString:@"\r\n"];
              NSData *d = [text dataUsingEncoding:NSUTF8StringEncoding];
              [self emitStderrData:d];
          }

          // One-shot QMP conversation: greeting -> capabilities -> command -> read.
          // Returns the first response line, or nil on any failure. Blocking by
          // design; only ever called from background queues.
          static NSString *QMPTransact(NSString *sockPath, NSString *cmd) {
              int fd = socket(AF_UNIX, SOCK_STREAM, 0);
              if (fd < 0) {
                  return nil;
              }
              struct sockaddr_un sa;
              memset(&sa, 0, sizeof(sa));
              sa.sun_family = AF_UNIX;
              strncpy(sa.sun_path, [sockPath UTF8String], sizeof(sa.sun_path) - 1);
              BOOL connected = NO;
              for (int i = 0; i < 12 && !connected; i++) {
                  if (connect(fd, (struct sockaddr *)&sa, sizeof(sa)) == 0) {
                      connected = YES;
                  } else {
                      usleep(250000);
                  }
              }
              if (!connected) {
                  close(fd);
                  return nil;
              }
              struct timeval tv;
              tv.tv_sec = 0;
              tv.tv_usec = 500000;
              setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
              char buf[512];
              for (int i = 0; i < 4; i++) {
                  if (recv(fd, buf, sizeof(buf), 0) <= 0) {
                      break;
                  }
              }
              const char *caps = "{\"execute\":\"qmp_capabilities\"}\n";
              if (write(fd, caps, strlen(caps)) < 0) {
                  close(fd);
                  return nil;
              }
              for (int i = 0; i < 2; i++) {
                  if (recv(fd, buf, sizeof(buf), 0) <= 0) {
                      break;
                  }
              }
              NSMutableString *cmdline = [cmd mutableCopy];
              [cmdline appendString:@"\n"];
              const char *cbytes = [cmdline UTF8String];
              if (write(fd, cbytes, strlen(cbytes)) < 0) {
                  close(fd);
                  return nil;
              }
              NSMutableData *resp = [NSMutableData data];
              for (int i = 0; i < 8; i++) {
                  ssize_t n = recv(fd, buf, sizeof(buf), 0);
                  if (n <= 0) {
                      break;
                  }
                  [resp appendBytes:buf length:(NSUInteger)n];
              }
              close(fd);
              return [[NSString alloc] initWithData:resp encoding:NSUTF8StringEncoding];
          }

          // Timed heartbeat that answers "is QEMU's main loop alive?" without
          // needing the guest to cooperate. (If the app was suspended when these
          // fire, the lines appear only once it is foregrounded again - that
          // lurch in timestamps is itself the suspension signature.)
          - (void)probeQMPAfter:(NSTimeInterval)delay tag:(NSString *)tag {
              NSString *path = [NSTemporaryDirectory() stringByAppendingPathComponent:@"qmp.sock"];
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(delay * NSEC_PER_SEC)),
                             dispatch_get_global_queue(QOS_CLASS_UTILITY, 0), ^{
                  if (!self->_isRunning) {
                      return;
                  }
                  NSString *r = QMPTransact(path, @"{\"execute\":\"query-status\"}");
                  NSString *s = r ? r : @"(no answer)";
                  NSRange nl = [s rangeOfCharacterFromSet:[NSCharacterSet newlineCharacterSet]];
                  if (nl.location != NSNotFound) {
                      s = [s substringToIndex:nl.location];
                  }
                  if (s.length > 300) {
                      s = [s substringToIndex:300];
                  }
                  NSString *line = [NSString stringWithFormat:@"[bridge] probe %@: QMP query-status -> %@", tag, s];
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (self->_isRunning) {
                          [self bridgeLog:line];
                      }
                  });
              });
          }

          static void *stderr_read_worker(void *arg) {
              StderrThreadArgs *st = (StderrThreadArgs *)arg;
              int fd = st->fd;
              FILE *lf = st->logFile;
              LinuxVMBridge *module = st->module;
              free(st);
              uint8_t buf[4096];
              ssize_t n;
              for (;;) {
                  n = read(fd, buf, sizeof(buf));
                  if (n > 0) {
                      @autoreleasepool {
                          if (lf) {
                              fwrite(buf, 1, (size_t)n, lf);
                              fflush(lf);
                          }
                          NSData *data = [NSData dataWithBytes:buf length:(NSUInteger)n];
                          [module emitStderrData:data];
                      }
                      continue;
                  }
                  if (n < 0 && errno == EINTR) {
                      continue;
                  }
                  break;
              }
              return NULL;
          }

          // v8: the JS startVM loop gave up after 6 s, but QEMU under TCI can take
          // far longer just to open its chardev. Retry every 1 s for up to 10 min.
          static void *serial_connect_worker(void *arg) {
              SerialThreadArgs *c = (SerialThreadArgs *)arg;
              LinuxVMBridge *module = c->module;
              free(c);
              for (int i = 0; i < 600; i++) {
                  if (![module vmRunning]) {
                      return NULL;
                  }
                  __block BOOL ok = NO;
                  dispatch_sync(dispatch_get_main_queue(), ^{
                      ok = [module tryConnectSerialOnce];
                  });
                  if (ok) {
                      return NULL;
                  }
                  usleep(1000000);
              }
              if ([module vmRunning]) {
                  [module bridgeLog:@"[bridge] serial socket never accepted a connection (10 min)."];
              }
              return NULL;
          }

          RCT_EXPORT_METHOD(startVM:(RCTPromiseResolveBlock)resolve rejecter:(RCTPromiseRejectBlock)reject) {
              if (_isRunning) {
                  resolve(@"VM is already running");
                  return;
              }
              if (_vmEverRan) {
                  reject(@"ERR_VM_RESTART", @"QEMU cannot boot twice in one process. Force-quit and reopen the app to boot again.", nil);
                  return;
              }

              // CocoaPods embeds vendored frameworks into <App>.app/Frameworks/
              NSString *frameworkBinary = @"qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu";
              NSString *rpathForm = [@"@rpath/" stringByAppendingString:frameworkBinary];
              NSString *bundleForm = [[[[NSBundle mainBundle] bundlePath]
                  stringByAppendingPathComponent:@"Frameworks"]
                  stringByAppendingPathComponent:frameworkBinary];

              void *handle = dlopen([rpathForm UTF8String], RTLD_LOCAL | RTLD_LAZY);
              if (!handle) {
                  handle = dlopen([bundleForm UTF8String], RTLD_LOCAL | RTLD_LAZY);
              }
              if (!handle) {
                  const char *err = dlerror();
                  reject(@"ERR_VM_LOAD",
                         [NSString stringWithFormat:@"dlopen QEMU failed: %s",
                          err ? err : "unknown error"], nil);
                  return;
              }

              QEMUInitFunc qemu_init = (QEMUInitFunc)dlsym(handle, "qemu_init");
              QEMUMainLoopFunc qemu_main_loop = (QEMUMainLoopFunc)dlsym(handle, "qemu_main_loop");
              QEMUCleanupFunc qemu_cleanup = (QEMUCleanupFunc)dlsym(handle, "qemu_cleanup");
              if (!qemu_init || !qemu_main_loop || !qemu_cleanup) {
                  dlclose(handle);
                  reject(@"ERR_VM_SYMBOLS",
                         @"QEMU entry points (qemu_init/main_loop/cleanup) not found", nil);
                  return;
              }

              // UTM-style guard (registered once): QEMU calls exit() on fatal errors.
              // An exit on the VM thread becomes a thread exit so the app survives,
              // and JS is told the VM died instead of hanging on "running".
              g_module = self;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  atexit_b(^{
                      if (g_qemu_thread_valid && pthread_equal(pthread_self(), g_qemu_thread)) {
                          @autoreleasepool {
                              [g_module qemuDidExitWithStatus:@"crashed"];
                          }
                          pthread_exit(NULL);
                      }
                  });
              });

              NSString *docs = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              NSString *workspace = [docs stringByAppendingPathComponent:@"workspace"];
              NSString *bundle = [[NSBundle mainBundle] bundlePath];

              NSFileManager *fm = [NSFileManager defaultManager];
              [fm createDirectoryAtPath:workspace withIntermediateDirectories:YES attributes:nil error:nil];

              // Pre-flight: prove the guest files are really inside the bundle.
              NSString *kernelPath = [bundle stringByAppendingPathComponent:@"vmlinuz-virt"];
              NSString *initrdPath = [bundle stringByAppendingPathComponent:@"initramfs-virt"];
              unsigned long long kSize = [[fm attributesOfItemAtPath:kernelPath error:nil] fileSize];
              unsigned long long iSize = [[fm attributesOfItemAtPath:initrdPath error:nil] fileSize];
              if (kSize == 0 || iSize == 0) {
                  reject(@"ERR_VM_GUEST", [NSString stringWithFormat:@"Guest files missing/empty in bundle (kernel %llu, initrd %llu bytes)", kSize, iSize], nil);
                  return;
              }
              // tmp/, not Documents/: sun_path holds 104 bytes and iOS
              // Documents paths sit right at that edge.
              NSString *qmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"qmp.sock"];
              unlink([qmpPath UTF8String]);
              [self bridgeLog:[NSString stringWithFormat:@"[bridge] guest files OK (kernel %llu KB, initrd %llu KB); starting QEMU...", kSize / 1024, iSize / 1024]];

              NSArray<NSString *> *qemuArgs = @[
                  @"qemu-system-aarch64", @"-M", @"virt", @"-cpu", @"cortex-a57", @"-smp", @"1", @"-m", @"512M",
                  @"-no-reboot",
                  @"-kernel", [bundle stringByAppendingPathComponent:@"vmlinuz-virt"],
                  @"-initrd", [bundle stringByAppendingPathComponent:@"initramfs-virt"],
                  // earlycon = kernel prints from its first instructions via the
                  // PL011 registers, long before the real console driver loads.
                  // If the guest boots at all, we SEE it. clocksource pin removed:
                  // under TCG it can stall early boot if the timer DT is odd.
                  @"-append", @"earlycon console=ttyAMA0 mitigations=off raid=noautodetect",
                  @"-fsdev", [NSString stringWithFormat:@"local,id=ws,path=%@,security_model=none", workspace],
                  @"-device", @"virtio-9p-pci,fsdev=ws,mount_tag=host_workspace",
                  @"-netdev", @"user,id=net0,hostfwd=tcp::3000-:3000,hostfwd=tcp::5173-:5173",
                  // NOTE: romfile= disables the NIC option ROM (needs pc-bios files
                  // we don't ship; pointless on ARM virt, Linux has virtio drivers).
                  @"-device", @"virtio-net-pci,netdev=net0,romfile=",
                  @"-chardev", @"socket,id=serial0,port=4000,host=127.0.0.1,server=on,wait=off",
                  // v10: QMP as a plain socket chardev + -mon backend (the exact
                  // option syntax proven to parse for the serial line above),
                  // instead of the dedicated -qmp spelling its parser rejected.
                  @"-chardev", [NSString stringWithFormat:@"socket,id=qmp0,path=%@,server=on,wait=off", qmpPath],
                  @"-mon", @"chardev=qmp0,mode=control",
                  @"-display", @"none",
                  @"-serial", @"chardev:serial0",
                  // v8: -nographic muxes the monitor onto stdio and can fight the
                  // explicit -serial; kill it and expose QMP for clean shutdown.
                  @"-monitor", @"none"
              ];
              [self bridgeLog:[NSString stringWithFormat:@"[bridge] argv: %@", [qemuArgs componentsJoinedByString:@" "]]];

              // Capture QEMU's stderr into a pipe: a reader thread tees every byte
              // to Documents/qemu-stderr.log (survives crashes, readable in Files app)
              // and to the live terminal. If setup fails, restore and continue plain.
              NSString *stderrLogPath = [docs stringByAppendingPathComponent:@"qemu-stderr.log"];
              FILE *stderrLog = fopen([stderrLogPath UTF8String], "w");
              int stderrPipe[2] = { -1, -1 };
              int stderrOrig = -1;
              if (stderrLog && pipe(stderrPipe) == 0) {
                  stderrOrig = dup(STDERR_FILENO);
                  dup2(stderrPipe[1], STDERR_FILENO);
                  StderrThreadArgs *sa = malloc(sizeof(StderrThreadArgs));
                  sa->module = self;
                  sa->fd = stderrPipe[0];
                  sa->logFile = stderrLog;
                  pthread_t stderrThread;
                  if (pthread_create(&stderrThread, NULL, stderr_read_worker, sa) == 0) {
                      pthread_detach(stderrThread);
                      g_stderrLog = stderrLog;
                  } else {
                      free(sa);
                      if (stderrOrig >= 0) {
                          dup2(stderrOrig, STDERR_FILENO);
                          close(stderrOrig);
                      }
                      close(stderrPipe[0]);
                      close(stderrPipe[1]);
                      fclose(stderrLog);
                  }
              } else if (stderrLog) {
                  fclose(stderrLog);
              }

              int count = (int)[qemuArgs count];
              VMThreadArgs *t = calloc(1, sizeof(VMThreadArgs));
              t->qemu_init = qemu_init;
              t->qemu_main_loop = qemu_main_loop;
              t->qemu_cleanup = qemu_cleanup;
              t->argc = count;
              t->argv = malloc(sizeof(char *) * (count + 1));
              for (int i = 0; i < count; i++) {
                  t->argv[i] = strdup([[qemuArgs objectAtIndex:i] UTF8String]);
              }
              t->argv[count] = NULL;
              t->module = self;

              pthread_attr_t vmAttr;
              pthread_attr_init(&vmAttr);
              pthread_attr_setstacksize(&vmAttr, 8 * 1024 * 1024);
              pthread_t thread;
              int vmCreateResult = pthread_create(&thread, &vmAttr, vm_thread_worker, t);
              pthread_attr_destroy(&vmAttr);
              if (vmCreateResult != 0) {
                  for (int i = 0; i < count; i++) {
                      free(t->argv[i]);
                  }
                  free(t->argv);
                  free(t);
                  dlclose(handle);
                  reject(@"ERR_VM_THREAD", @"Failed to spawn QEMU pthread", nil);
                  return;
              }
              g_qemu_thread = thread;
              g_qemu_thread_valid = YES;
              pthread_detach(thread);
              _vmEverRan = YES;
              _isRunning = YES;
              [self sendEventWithName:@"VMStatus" body:@{@"status": @"started"}];
              // iOS suspends every thread when the display sleeps: keep the app
              // foreground-awake while the VM runs, or "30 min of booting" is
              // really 30 seconds with the screen off.
              [UIApplication sharedApplication].idleTimerDisabled = YES;
              [self probeQMPAfter:90 tag:@"t+90s"];
              [self probeQMPAfter:420 tag:@"t+7min"];
              [self probeQMPAfter:1200 tag:@"t+20min"];
              [self bridgeLog:@"[bridge] QEMU thread launched. Boot text will appear in this terminal; under TCG expect minutes, not seconds."];
              SerialThreadArgs *ca = malloc(sizeof(SerialThreadArgs));
              ca->module = self;
              ca->fd = -1;
              pthread_t cthread;
              if (pthread_create(&cthread, NULL, serial_connect_worker, ca) == 0) {
                  pthread_detach(cthread);
              } else {
                  free(ca);
              }
              // NOTE: dlopen handle intentionally kept open for app lifetime (same as UTM).
              resolve(@"VM initialized on port 4000");
          }

          RCT_EXPORT_METHOD(connectSerial:(RCTPromiseResolveBlock)resolve rejecter:(RCTPromiseRejectBlock)reject) {
              if (!_isRunning) {
                  reject(@"ERR_VM_NOT_RUNNING", @"VM is not running", nil);
                  return;
              }
              if (_serialConnected) {
                  resolve(@"Serial already connected");
                  return;
              }
              if ([self tryConnectSerialOnce]) {
                  resolve(@"Serial connected on port 4000");
              } else {
                  reject(@"ERR_SERIAL_CONNECT", @"connect 127.0.0.1:4000 failed (native retry loop keeps trying)", nil);
              }
          }

          RCT_EXPORT_METHOD(disconnectSerial:(RCTPromiseResolveBlock)resolve rejecter:(RCTPromiseRejectBlock)reject) {
              if (!_serialConnected) {
                  resolve(@"Serial already disconnected");
                  return;
              }
              // shutdown() unblocks the reader thread's recv(); it reports the disconnect.
              _serialConnected = NO;
              if (_serialFd >= 0) {
                  shutdown(_serialFd, SHUT_RDWR);
                  close(_serialFd);
                  _serialFd = -1;
              }
              resolve(@"Serial disconnected");
          }

          RCT_EXPORT_METHOD(writeSerial:(NSString *)base64
                            resolver:(RCTPromiseResolveBlock)resolve
                            rejecter:(RCTPromiseRejectBlock)reject) {
              if (!_serialConnected || _serialFd < 0) {
                  reject(@"ERR_SERIAL_CLOSED", @"Serial not connected", nil);
                  return;
              }
              NSData *data = [[NSData alloc] initWithBase64EncodedString:base64
                                                                 options:NSDataBase64DecodingIgnoreUnknownCharacters];
              if (!data || data.length == 0) {
                  resolve(@0);
                  return;
              }
              const uint8_t *bytes = (const uint8_t *)data.bytes;
              NSUInteger total = data.length;
              NSUInteger sent = 0;
              while (sent < total) {
                  ssize_t n = send(_serialFd, bytes + sent, total - sent, 0);
                  if (n <= 0) {
                      reject(@"ERR_SERIAL_WRITE", @"send() failed", nil);
                      return;
                  }
                  sent += (NSUInteger)n;
              }
              resolve(@(sent));
          }

          // v8: real Stop. Ask QEMU itself to quit over QMP; works even when the
          // guest sits at a login prompt and 'poweroff' typed to the serial does
          // nothing. QEMU then unwinds and reports 'exited' through qemuDidExit.
          RCT_EXPORT_METHOD(stopVM:(RCTPromiseResolveBlock)resolve rejecter:(RCTPromiseRejectBlock)reject) {
              if (!_isRunning) {
                  resolve(@"VM not running");
                  return;
              }
              NSString *qmpPath2 = [NSTemporaryDirectory() stringByAppendingPathComponent:@"qmp.sock"];
              dispatch_async(dispatch_get_main_queue(), ^{
                  int fd = -1;
                  for (int i = 0; i < 40 && fd < 0; i++) {
                      fd = socket(AF_UNIX, SOCK_STREAM, 0);
                      if (fd < 0) {
                          usleep(250000);
                          continue;
                      }
                      struct sockaddr_un sa;
                      memset(&sa, 0, sizeof(sa));
                      sa.sun_family = AF_UNIX;
                      strncpy(sa.sun_path, [qmpPath2 UTF8String], sizeof(sa.sun_path) - 1);
                      if (connect(fd, (struct sockaddr *)&sa, sizeof(sa)) != 0) {
                          close(fd);
                          fd = -1;
                          usleep(250000);
                      }
                  }
                  if (fd < 0) {
                      reject(@"ERR_QMP_CONNECT", @"Could not connect to the QMP socket (QEMU may still be starting)", nil);
                      return;
                  }
                  struct timeval tv;
                  tv.tv_sec = 0;
                  tv.tv_usec = 300000;
                  setsockopt(fd, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
                  char drain[512];
                  for (int i = 0; i < 6; i++) {
                      ssize_t n = recv(fd, drain, sizeof(drain), 0);
                      if (n <= 0) {
                          break;
                      }
                  }
                  const char *caps = "{\"execute\":\"qmp_capabilities\"}\n";
                  const char *quit = "{\"execute\":\"quit\"}\n";
                  if (write(fd, caps, strlen(caps)) < 0) {
                      /* best effort: QEMU may already be gone */
                  }
                  for (int i = 0; i < 3; i++) {
                      ssize_t n = recv(fd, drain, sizeof(drain), 0);
                      if (n <= 0) {
                          break;
                      }
                  }
                  if (write(fd, quit, strlen(quit)) < 0) {
                      close(fd);
                      reject(@"ERR_QMP_WRITE", @"write to QMP failed", nil);
                      return;
                  }
                  close(fd);
                  [self bridgeLog:@"[bridge] QMP quit sent - QEMU shutting down"];
                  resolve(@"quit sent");
              });
          }

          @end
          EOF

          cd ios/UTM-QEMU
          curl -fSL -o UTM-SE.zip https://github.com/utmapp/UTM/releases/download/v4.5.3/UTM-SE.ipa
          unzip -q UTM-SE.zip
          mv Payload/*.app/Frameworks/* ./Frameworks/ 2>/dev/null || true
          echo "--- Frameworks before pruning ---"
          ls Frameworks
          find Frameworks -type d -name "qemu-*.framework" ! -name "qemu-aarch64-softmmu.framework" -exec rm -rf {} +
          # MINIMAL prune: ONLY the ANGLE frameworks carry Apple's
          # allowable_client restriction (verified: all others link clean).
          # spice-server / virglrenderer / epoxy are LC_LOADed by the QEMU
          # framework itself, so removing them breaks dlopen at runtime.
          rm -rf Frameworks/GLESv2.framework
          rm -rf Frameworks/EGL.framework
          rm -rf Payload UTM-SE.zip
          echo "--- Frameworks after pruning ---"
          ls Frameworks
          echo "--- QEMU framework linked dependencies (for runtime diagnosis) ---"
          QEMU_FW=Frameworks/qemu-aarch64-softmmu.framework
          QEMU_BIN="$QEMU_FW/qemu-aarch64-softmmu"
          [ -f "$QEMU_BIN" ] || QEMU_BIN=$(find "$QEMU_FW" -maxdepth 1 -type f ! -name "*.plist" | head -n 1)
          echo "QEMU binary: $QEMU_BIN"
          otool -L "$QEMU_BIN" || true
          echo "--- Fail-fast gate: QEMU entry trio must be exported ---"
          NM_OUT=$(nm -gU "$QEMU_BIN" 2>/dev/null || true)
          grep -q "T _qemu_init" <<< "$NM_OUT" || { echo "FATAL: _qemu_init not exported by QEMU framework"; exit 1; }
          grep -q "T _qemu_main_loop" <<< "$NM_OUT" || { echo "FATAL: _qemu_main_loop not exported by QEMU framework"; exit 1; }
          grep -q "T _qemu_cleanup" <<< "$NM_OUT" || { echo "FATAL: _qemu_cleanup not exported by QEMU framework"; exit 1; }
          echo "OK: qemu_init / qemu_main_loop / qemu_cleanup all exported."
          echo "--- Gate: every qemu @rpath dep must be embedded (else dlopen fails) ---"
          MISSING=0
          for DEP in $(otool -L "$QEMU_BIN" | grep "@rpath" | awk '{print $1}' | sed 's|@rpath/||'); do
            if [ ! -e "Frameworks/$DEP" ]; then echo "MISSING: Frameworks/$DEP"; MISSING=1; fi
          done
          [ "$MISSING" -eq 0 ] || { echo "FATAL: QEMU has unembedded @rpath dependencies (see MISSING above)"; exit 1; }
          echo "OK: all qemu @rpath dependencies embedded."
          echo "--- Audit: does any kept framework still LC_LOAD the removed EGL/GLESv2? ---"
          for FWBIN in Frameworks/epoxy.0.framework/epoxy.0 Frameworks/spice-server.1.framework/spice-server.1 Frameworks/virglrenderer.1.framework/virglrenderer.1; do
            echo "== $FWBIN"
            otool -L "$FWBIN" 2>/dev/null | grep -iE "egl|gles" || echo "   (no EGL/GLESv2 linkage)"
          done

          cat << 'EOF' > UTM-QEMU.podspec
          Pod::Spec.new do |s|
            s.name         = "UTM-QEMU"
            s.version      = "1.0.0"
            s.summary      = "Headless QEMU for iOS"
            s.homepage     = "https://github.com/utmapp/UTM"
            s.author       = "UTM"
            s.source       = { :path => "." }
            s.platform     = :ios, "15.0"
            s.source_files = "Sources/*.{h,m,swift}"
            s.resources    = "Resources/*"
            s.vendored_frameworks = "Frameworks/*.framework"
            s.dependency 'React-Core'
          end
          EOF

      - name: Configure iOS Deployment Target and Device Family
        run: |
          cd ios
          perl -pi -e "s/platform :ios,.*/platform :ios, '15.0'/g" Podfile
          grep -q "UTM-QEMU" Podfile || perl -pi -e "s/(target 'MobileLinuxEditor' do)/\$1\n  pod 'UTM-QEMU', :path => '.\/UTM-QEMU'/g" Podfile
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" MobileLinuxEditor.xcodeproj/project.pbxproj
          # Universal app: 1 = iPhone, 2 = iPad. The RN 0.74 template OMITS
          # TARGETED_DEVICE_FAMILY entirely (effective default: iPhone-only),
          # so replace it when present, else insert into every buildSettings block.
          if grep -q "TARGETED_DEVICE_FAMILY" MobileLinuxEditor.xcodeproj/project.pbxproj; then
            perl -pi -e 's/TARGETED_DEVICE_FAMILY = [^;]*;/TARGETED_DEVICE_FAMILY = "1,2";/g' MobileLinuxEditor.xcodeproj/project.pbxproj
          else
            perl -pi -e 's/(buildSettings\s*=\s*\{\n)/$1\t\t\t\tTARGETED_DEVICE_FAMILY = "1,2";\n/g' MobileLinuxEditor.xcodeproj/project.pbxproj
          fi
          echo "--- Device family now ---"
          grep "TARGETED_DEVICE_FAMILY" MobileLinuxEditor.xcodeproj/project.pbxproj || { echo "FATAL: TARGETED_DEVICE_FAMILY still missing"; exit 1; }
          echo "--- Podfile (top 30 lines) ---"
          head -n 30 Podfile
          pod --version

      - name: Enable Universal iPhone+iPad Layout
        run: |
          cd ios
          PLIST=MobileLinuxEditor/Info.plist
          # Full-screen app (predictable canvas on iPhone + iPad, all orientations)
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          # All 4 orientations on iPad (idempotent rebuild of the array)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          for O in UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do
            /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad: string $O" "$PLIST"
          done
          echo "--- iPad layout keys ---"
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UISupportedInterfaceOrientations~ipad" "$PLIST"

      - name: CocoaPods Install
        run: |
          cd ios
          set -o pipefail
          pod install 2>&1 | tail -n 60

      - name: Compile iOS Application
        run: |
          cd ios
          xcodebuild build \
            -workspace MobileLinuxEditor.xcworkspace \
            -scheme MobileLinuxEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO > xcodebuild.log 2>&1 || {
              echo "=== BUILD FAILED: COMPACT ERROR SUMMARY ==="
              grep -E -B 8 -A 2 "(error:|fatal error:|The following build commands failed)" xcodebuild.log || tail -n 80 xcodebuild.log
              exit 1
            }
          echo "BUILD SUCCEEDED"

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/build_output/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          test -n "$APP_PATH" || { echo "ERROR: no .app found"; exit 1; }
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr MobileLinuxEditor.ipa Payload
          echo "Successfully created MobileLinuxEditor.ipa"
          ls -lh MobileLinuxEditor.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileLinuxEditor-IPA
          path: build/MobileLinuxEditor.ipa

      - name: Upload dSYM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileLinuxEditor-dSYM
          path: ios/build_output/Build/Products/Release-iphoneos/*.dSYM

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
