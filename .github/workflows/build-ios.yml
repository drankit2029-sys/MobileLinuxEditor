name: Build iOS Native Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Fix React Native Codegen Compatibility
        run: |
          node -e '
            const fs = require("fs");
            const file = "./node_modules/@dr.pogodin/react-native-fs/package.json";
            if (fs.existsSync(file)) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              delete pkg.codegenConfig;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2));
            }
          '

      - name: Scaffold React Native iOS Project
        run: |
          npx @react-native-community/cli@latest init MobileLinuxEditor --version 0.74.5 --directory ./NativeTemp --skip-install
          mkdir -p ios
          cp -R NativeTemp/ios/. ./ios/
          cp -n NativeTemp/app.json ./ || true
          cp -n NativeTemp/index.js ./ || true
          rm -rf NativeTemp

      - name: Configure React Native Node Environment
        run: |
          # Tells the "Bundle React Native code and images" phase exactly where Node is
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Assemble UTM-QEMU Local Pod
        run: |
          mkdir -p ios/UTM-QEMU/Frameworks
          mkdir -p ios/UTM-QEMU/Sources
          mkdir -p ios/UTM-QEMU/Resources
          
          mkdir -p assets/guest
          [ -f assets/guest/vmlinuz-virt ] || touch assets/guest/vmlinuz-virt
          [ -f assets/guest/initramfs-virt.cpio.gz ] || touch assets/guest/initramfs-virt.cpio.gz
          cp assets/guest/vmlinuz-virt ios/UTM-QEMU/Resources/
          cp assets/guest/initramfs-virt.cpio.gz ios/UTM-QEMU/Resources/
          
          cat << 'EOF' > ios/UTM-QEMU/Sources/LinuxVMBridge.m
          #import <React/RCTBridgeModule.h>
          #import <pthread.h>

          extern int qemu_main(int argc, char **argv);

          @interface LinuxVMBridge : NSObject <RCTBridgeModule>
          @end

          @implementation LinuxVMBridge { BOOL _isRunning; }

          RCT_EXPORT_MODULE();

          + (BOOL)requiresMainQueueSetup { return NO; }

          static void *vm_thread_worker(void *arg) {
              char **argv = (char **)arg;
              int argc = 0;
              while (argv[argc] != NULL) argc++;
              qemu_main(argc, argv);
              for (int i = 0; i < argc; i++) free(argv[i]);
              free(argv);
              return NULL;
          }

          RCT_EXPORT_METHOD(startVM:(RCTPromiseResolveBlock)resolve rejecter:(RCTPromiseRejectBlock)reject) {
              if (_isRunning) { resolve(@"VM is already running"); return; }
              
              NSString *docs = [NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES) firstObject];
              NSString *workspace = [docs stringByAppendingPathComponent:@"workspace"];
              NSString *bundle = [[NSBundle mainBundle] bundlePath];
              
              [[NSFileManager defaultManager] createDirectoryAtPath:workspace withIntermediateDirectories:YES attributes:nil error:nil];
              
              NSArray<NSString *> *qemuArgs = @[
                  @"qemu-system-aarch64", @"-M", @"virt", @"-cpu", @"cortex-a57", @"-smp", @"1", @"-m", @"512M",
                  @"-kernel", [bundle stringByAppendingPathComponent:@"vmlinuz-virt"],
                  @"-initrd", [bundle stringByAppendingPathComponent:@"initramfs-virt.cpio.gz"],
                  @"-append", @"console=ttyAMA0 mitigations=off clocksource=arch_sys_counter quiet raid=noautodetect",
                  @"-fsdev", [NSString stringWithFormat:@"local,id=ws,path=%@,security_model=none", workspace],
                  @"-device", @"virtio-9p-pci,fsdev=ws,mount_tag=host_workspace",
                  @"-netdev", @"user,id=net0,hostfwd=tcp::3000-:3000,hostfwd=tcp::5173-:5173",
                  @"-device", @"virtio-net-pci,netdev=net0",
                  @"-chardev", @"socket,id=serial0,port=4000,host=127.0.0.1,server=on,wait=off",
                  @"-serial", @"chardev:serial0", @"-nographic"
              ];
              
              int count = (int)[qemuArgs count];
              char **argv = malloc(sizeof(char *) * (count + 1));
              for (int i = 0; i < count; i++) argv[i] = strdup([[qemuArgs objectAtIndex:i] UTF8String]);
              argv[count] = NULL;
              
              pthread_t thread;
              if (pthread_create(&thread, NULL, vm_thread_worker, (void *)argv) != 0) {
                  free(argv);
                  reject(@"ERR_VM_THREAD", @"Failed to spawn QEMU pthread", nil);
                  return;
              }
              pthread_detach(thread);
              _isRunning = YES;
              resolve(@"VM initialized on port 4000");
          }
          @end
          EOF
          
          cd ios/UTM-QEMU
          curl -L -o UTM-SE.zip https://github.com/utmapp/UTM/releases/download/v4.5.3/UTM-SE.ipa
          unzip -q UTM-SE.zip
          mv Payload/*.app/Frameworks/*.framework ./Frameworks/
          find Frameworks -type d -name "qemu-*.framework" ! -name "qemu-aarch64-softmmu.framework" -exec rm -rf {} +
          rm -rf Payload UTM-SE.zip

          cat << 'EOF' > UTM-QEMU.podspec
          Pod::Spec.new do |s|
            s.name         = "UTM-QEMU"
            s.version      = "1.0.0"
            s.summary      = "Prebuilt QEMU for iOS"
            s.homepage     = "https://github.com/utmapp/UTM"
            s.author       = "UTM"
            s.source       = { :path => "." }
            s.platform     = :ios, "15.0"
            s.source_files = "Sources/*.{h,m,swift}"
            s.resources    = "Resources/*"
            s.vendored_frameworks = "Frameworks/*.framework"
            s.dependency 'React-Core'
          end
          EOF

      - name: Configure Podfile
        run: |
          cd ios
          perl -pi -e "s/platform :ios,.*/platform :ios, '15.0'/g" Podfile
          grep -q "UTM-QEMU" Podfile || perl -pi -e "s/(target 'MobileLinuxEditor' do)/\$1\n  pod 'UTM-QEMU', :path => '.\/UTM-QEMU'/g" Podfile

      - name: CocoaPods Install
        run: |
          cd ios
          pod install

      - name: Compile iOS Archive
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive \
            -workspace MobileLinuxEditor.xcworkspace \
            -scheme MobileLinuxEditor \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath MobileLinuxEditor.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "=== BUILD FAILED: PRINTING ERROR SUMMARY ==="
              grep -E -C 3 "error:|fatal error:|The following build commands failed" xcodebuild.log || tail -n 120 xcodebuild.log
              exit 1
            }

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/MobileLinuxEditor.xcarchive/Products/Applications/MobileLinuxEditor.app build/Payload/
          cd build
          zip -qr MobileLinuxEditor.ipa Payload
          echo "IPA build completed successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileLinuxEditor-IPA
          path: build/MobileLinuxEditor.ipa