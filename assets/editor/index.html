<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Editor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      overflow: hidden;
    }
    #editor {
      height: 100%;
      width: 100%;
      font-family: Menlo, Monaco, 'Courier New', monospace;
      font-size: 14px;
    }
    .cm-editor {
      height: 100%;
    }
    .cm-scroller {
      overflow: auto;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
</head>
<body>
  <div id="editor"
       autocapitalize="none"
       autocorrect="off"
       spellcheck="false"
       autocomplete="off"></div>

  <script>
    var editor = CodeMirror(document.getElementById("editor"), {
      value: "// Mobile Linux Workspace\n// Code saved here syncs directly to /root/workspace in Alpine Linux\n\nconsole.log('Hello from iOS sandbox');\n",
      mode: "javascript",
      theme: "dracula",
      lineNumbers: true,
      lineWrapping: true,
      inputStyle: "contenteditable"
    });

    // Expose programmatic insertion for React Native accessory keyboard bar
    window.insertSymbol = function(char) {
      var doc = editor.getDoc();
      var cursor = doc.getCursor();
      var insertText = (char === 'Tab') ? '  ' : char;
      doc.replaceRange(insertText, cursor);
      editor.focus();
    };

    // Notify React Native on content change
    editor.on("change", function() {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: "change",
          value: editor.getValue()
        }));
      }
    });
  </script>
</body>
</html>
